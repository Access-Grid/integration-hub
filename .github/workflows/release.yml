name: Release

# Triggered by pushing a tag like v0.1.0. Builds a Windows .exe and a
# macOS binary with PyInstaller and attaches them to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        shell: pwsh

      - name: Smoke test (CLI imports)
        env:
          AG_SYNC_ENCRYPTION_KEY: ${{ secrets.CI_FERNET_KEY || 'YWdzeW5jLWNpLWR1bW15LWtleS1kby1ub3QtdXNlISE=' }}
        run: |
          agsync --version
          python -c "from agsync.server import create_app; create_app()"
        shell: pwsh

      - name: Build .exe with PyInstaller
        env:
          AG_SYNC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --name agsync `
            --collect-all agsync `
            --collect-all accessgrid `
            --collect-all pydbisam `
            --collect-all truststore `
            --hidden-import agsync.lib.pacs.avigilon `
            --hidden-import agsync.lib.pacs.avigilon_alta `
            --hidden-import agsync.lib.pacs.cdvi `
            --hidden-import agsync.lib.pacs.dmp `
            --hidden-import agsync.lib.pacs.lenel `
            --hidden-import agsync.lib.pacs.millennium_ultra `
            --hidden-import win32timezone `
            --add-data "src/agsync/templates;agsync/templates" `
            --add-data "src/agsync/static;agsync/static" `
            --add-data "src/agsync/locales;agsync/locales" `
            scripts/pyinstaller_entry.py
        shell: pwsh

      - name: Verify built binary
        run: |
          dist\agsync.exe --version
        shell: pwsh

      # A second, much smaller exe: a read-only dump of the tracking table
      # and the Seos ledger. Shipped alongside because what this install
      # believes it has issued has so far only been inferable from log
      # lines, and a rule that decides whether to delete somebody's pass
      # needs checking against the real rows first.
      - name: Build agdiag.exe with PyInstaller
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --name agdiag `
            --collect-all agsync `
            --hidden-import win32timezone `
            scripts/agdiag_entry.py
        shell: pwsh

      - name: Verify agdiag runs and withholds secrets
        env:
          AG_SYNC_DB_PATH: ${{ runner.temp }}\no-such.db
        run: |
          $out = dist\agdiag.exe | Out-String
          if ($LASTEXITCODE -ne 0) { throw "agdiag exited $LASTEXITCODE" }
          if ($out -notmatch "diagnostic dump") { throw "unexpected output: $out" }
        shell: pwsh

      # Records in the hub's database the Unity tokens a hub before 0.2.37
      # created but refused as not its own, which stranded their passes. It
      # reads Unity and writes only the hub's own database, after a backup.
      - name: Build ag-cleanup.exe with PyInstaller
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --name ag-cleanup `
            --collect-all agsync `
            --collect-all pydbisam `
            --collect-all truststore `
            --hidden-import agsync.lib.pacs.avigilon `
            --hidden-import win32timezone `
            scripts/agcleanup_entry.py
        shell: pwsh

      - name: Verify ag-cleanup runs and changes nothing without a database
        run: |
          # Exit 1 is the expected answer here, not a failure of the step.
          $PSNativeCommandUseErrorActionPreference = $false
          $out = dist\ag-cleanup.exe --db "${{ runner.temp }}\no-such.db" | Out-String
          if ($LASTEXITCODE -ne 1) { throw "ag-cleanup exited $LASTEXITCODE" }
          if ($out -notmatch "nothing changed") { throw "unexpected output: $out" }
          $out = dist\ag-cleanup.exe --help | Out-String
          if ($out -notmatch "ADOPT|adopt") { throw "unexpected help: $out" }
        shell: pwsh

      # A standalone, read-only probe of an Avigilon Unity box: which login
      # and formats (JSON/XML) it answers, and whether AccessGrid is
      # reachable. Built from the script alone — it needs only httpx — so a
      # site can run it before the hub is installed.
      - name: Build avigilon-discovery.exe with PyInstaller
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --name avigilon-discovery `
            scripts/avigilon_probe.py
        shell: pwsh

      - name: Verify avigilon-discovery runs
        run: |
          $out = dist\avigilon-discovery.exe --help | Out-String
          if ($LASTEXITCODE -ne 0) { throw "avigilon-discovery exited $LASTEXITCODE" }
          if ($out -notmatch "username") { throw "unexpected output: $out" }
        shell: pwsh

      # A standalone, read-only probe of a DMP System Link database: whether the
      # encryption key decrypts the tables, whether our live-row filtering
      # matches DBISAM's own record count, what the adapter makes of the rows,
      # and whether AccessGrid is reachable. Unlike avigilon-discovery it runs
      # the hub's own DMP client and adapter, so it collects agsync and
      # pydbisam. A site can run it before the hub is installed.
      - name: Build dmp-discovery.exe with PyInstaller
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --name dmp-discovery `
            --collect-all agsync `
            --collect-all pydbisam `
            --collect-all truststore `
            --hidden-import agsync.lib.pacs.dmp `
            scripts/dmp_probe.py
        shell: pwsh

      - name: Verify dmp-discovery runs
        run: |
          $out = dist\dmp-discovery.exe --help | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dmp-discovery exited $LASTEXITCODE" }
          if ($out -notmatch "db_path") { throw "unexpected output: $out" }
        shell: pwsh

      - name: Compute release name
        id: rel
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "v0.0.0-${{ github.run_number }}" }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agsync-windows-${{ steps.rel.outputs.tag }}
          path: |
            dist/agsync.exe
            dist/agdiag.exe
            dist/ag-cleanup.exe
            dist/avigilon-discovery.exe
            dist/dmp-discovery.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.rel.outputs.tag }}
          files: |
            dist/agsync.exe
            dist/agdiag.exe
            dist/ag-cleanup.exe
            dist/avigilon-discovery.exe
            dist/dmp-discovery.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Smoke test (CLI imports)
        env:
          AG_SYNC_ENCRYPTION_KEY: ${{ secrets.CI_FERNET_KEY || 'YWdzeW5jLWNpLWR1bW15LWtleS1kby1ub3QtdXNlISE=' }}
        run: |
          agsync --version
          python -c "from agsync.server import create_app; create_app()"

      - name: Build binary with PyInstaller
        env:
          AG_SYNC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          pyinstaller \
            --noconfirm \
            --onefile \
            --name agsync \
            --collect-all agsync \
            --collect-all accessgrid \
            --collect-all pydbisam \
            --collect-all truststore \
            --hidden-import agsync.lib.pacs.avigilon \
            --hidden-import agsync.lib.pacs.avigilon_alta \
            --hidden-import agsync.lib.pacs.cdvi \
            --hidden-import agsync.lib.pacs.dmp \
            --hidden-import agsync.lib.pacs.lenel \
            --hidden-import agsync.lib.pacs.millennium_ultra \
            --add-data "src/agsync/templates:agsync/templates" \
            --add-data "src/agsync/static:agsync/static" \
            --add-data "src/agsync/locales:agsync/locales" \
            scripts/pyinstaller_entry.py

      - name: Verify built binary
        run: |
          ./dist/agsync --version

      - name: Compute release name
        id: rel
        run: |
          tag="${{ github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) tag="v0.0.0-${{ github.run_number }}" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package binary
        run: |
          arch=$(uname -m)
          cd dist
          zip -9 "agsync-macos-$arch.zip" agsync
          echo "ARCH=$arch" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agsync-macos-${{ env.ARCH }}-${{ steps.rel.outputs.tag }}
          path: dist/agsync-macos-${{ env.ARCH }}.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.rel.outputs.tag }}
          files: dist/agsync-macos-${{ env.ARCH }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
